<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400">
  <title>Hundreds of pages in, one book out</title>
  <desc>A serial spread across 109 chapter web pages becomes one EPUB, or several PDFs of 25 chapters each.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#21314c" stroke-width=".7"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m0 0 10 5-10 5" fill="#4de3ff"/></marker>
  </defs>
  <rect width="720" height="400" fill="#081222"/>
  <rect width="720" height="400" fill="url(#grid)"/>
  <g font-family="ui-monospace,monospace" text-anchor="middle">
    <text x="360.0" y="47" font-size="24" fill="#e8f1ff">Hundreds of pages in, one book out</text>
    <rect x="88" y="70" width="190" height="150" rx="8" fill="#111f37" stroke="#375271" stroke-width="2"/><rect x="76" y="80" width="190" height="150" rx="8" fill="#111f37" stroke="#375271" stroke-width="2"/><rect x="64" y="90" width="190" height="150" rx="8" fill="#111f37" stroke="#375271" stroke-width="2"/><rect x="52" y="100" width="190" height="150" rx="8" fill="#111f37" stroke="#375271" stroke-width="2"/><rect x="40" y="110" width="190" height="150" rx="8" fill="#111f37" stroke="#375271" stroke-width="2"/><path d="M40 132H230" stroke="#375271" stroke-width="2"/><text x="135" y="170" font-size="18" fill="#e8f1ff">Chapter 109</text><rect x="60" y="190" width="150" height="6" rx="3" fill="#263d59"/><rect x="60" y="204" width="130" height="6" rx="3" fill="#263d59"/><rect x="60" y="218" width="150" height="6" rx="3" fill="#263d59"/><rect x="60" y="232" width="96" height="6" rx="3" fill="#263d59"/><text x="160" y="300" font-size="17" fill="#a8bad2">109 web pages</text><text x="372" y="170" font-size="18" fill="#4de3ff">rr-scraper</text><path d="M292 185L452 185" stroke="#4de3ff" stroke-width="2" marker-end="url(#arrow)"/><rect x="470" y="110" width="210" height="150" rx="10" fill="#111f37" stroke="#4de3ff" stroke-width="2"/><text x="575.0" y="146" font-size="15" fill="#4de3ff">ONE BOOK</text><text x="575.0" y="177" font-size="15" fill="#e8f1ff">Mother of Learning</text><text x="575.0" y="200" font-size="13" fill="#a8bad2">.epub · chapters 1-109</text><text x="575" y="300" font-size="17" fill="#a8bad2">or 5 PDFs of 25</text><text x="360" y="350" font-size="19" fill="#ffd166">One file for an e-reader, or any group size</text><text x="360" y="380" font-size="15" fill="#a8bad2">Text only: no images or page styling</text>
  </g>
</svg>

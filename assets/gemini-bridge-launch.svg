<text x="32" y="23" fill="#c5d8e4">hydrogen-manual</text><text x="738" y="23" text-anchor="end" fill="#9bb3c4">LAUNCH</text>
<text xml:space="preserve" x="18" y="60" fill="#a6d6e6">PS C:\code\my-project&gt; hydrogen-manual</text>
<text xml:space="preserve" x="18" y="78" fill="#e0eaf2">Starting bridge... if a browser window opens, sign in there (it closes when you&#x27;re done).</text>
<text xml:space="preserve" x="18" y="96" fill="#8fdbbd">Bridge ready at http://127.0.0.1:8766/v1</text>
<text xml:space="preserve" x="18" y="114" fill="#7d93b8"># OpenCode opens on hydrogen/gemini-4-hydrogen; /models switches models</text>
<text xml:space="preserve" x="18" y="150" fill="#a6d6e6">PS C:\code&gt; hydrogen-manual -BridgeOnly</text>
<text xml:space="preserve" x="18" y="168" fill="#e0eaf2">Bridge already running at http://127.0.0.1:8766/v1</text>
<text xml:space="preserve" x="18" y="186" fill="#8fdbbd">Base URL: http://127.0.0.1:8766/v1   API key: x   Model: gemini-4-hydrogen</text>
<text xml:space="preserve" x="18" y="204" fill="#7d93b8"># any OpenAI-compatible client can use that base URL</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400">
  <title>OpenCode connects through Gemini Bridge to Gemini Enterprise</title>
  <desc>A terminal coding client sends requests through a local bridge to a signed-in enterprise browser session, which returns model responses.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#21314c" stroke-width=".7"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m0 0 10 5-10 5" fill="#4de3ff"/></marker>
  </defs>
  <rect width="720" height="400" fill="#081222"/>
  <rect width="720" height="400" fill="url(#grid)"/>
  <g font-family="ui-monospace,monospace" text-anchor="middle">
    <text x="360" y="47" font-size="27" fill="#e8f1ff">Your web account. Your coding tools.</text>
    <g fill="#111f37" stroke="#375271" stroke-width="2">
      <rect x="24" y="105" width="190" height="184" rx="10"/>
      <rect x="265" y="128" width="190" height="138" rx="10" stroke="#4de3ff"/>
      <rect x="506" y="105" width="190" height="184" rx="10"/>
    </g>
    <path d="M24 139H214M506 139H696" stroke="#375271" stroke-width="2"/>
    <g fill="#7d93b8"><circle cx="40" cy="122" r="4"/><circle cx="54" cy="122" r="4"/><circle cx="68" cy="122" r="4"/></g>
    <rect x="525" y="116" width="151" height="12" rx="6" fill="#263d59"/>
    <text x="119" y="187" font-size="35" fill="#ffd166">&gt;_</text>
    <text x="119" y="229" font-size="27" fill="#e8f1ff">OpenCode</text>
    <text x="119" y="262" font-size="16" fill="#a8bad2">Read · Edit · Run</text>
    <text x="360" y="177" font-size="23" fill="#4de3ff">GEMINI</text>
    <text x="360" y="212" font-size="29" fill="#e8f1ff">BRIDGE</text>
    <text x="360" y="244" font-size="19" fill="#a8bad2">Runs locally</text>
    <path d="M601 152Q605 173 625 177Q605 181 601 202Q597 181 577 177Q597 173 601 152" fill="#b2a2ff"/>
    <text x="601" y="232" font-size="25" fill="#e8f1ff">Gemini</text>
    <text x="601" y="263" font-size="22" fill="#a8bad2">Enterprise</text>
    <g stroke="#4de3ff" stroke-width="2" marker-end="url(#arrow)">
      <path d="M215 183H264"/>
      <path d="M456 183H505"/>
      <path d="M505 215H456"/>
      <path d="M264 215H215"/>
    </g>
    <text x="360" y="336" font-size="23" fill="#ffd166">Sign in once · No separate API key</text>
    <text x="360" y="372" font-size="19" fill="#a8bad2">An independent browser integration</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" width="720" height="560" role="img">
<title>How to use rr-scraper</title>
<desc>Six steps: run node chapter-scraper.js, enter a title or story link, pick a search result, choose TXT, PDF or EPUB, choose chapters per file, and read the file saved in downloads.</desc>
<defs><pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#21314c" stroke-width=".7"/></pattern></defs>
<rect width="720" height="560" fill="#081222"/><rect width="720" height="560" fill="url(#g)"/>
<g font-family="ui-monospace,Consolas,&quot;Liberation Mono&quot;,monospace">
<text x="360.0" y="46" font-size="24" fill="#e8f1ff" text-anchor="middle">How to use rr-scraper</text>
<text x="360.0" y="74" font-size="14" fill="#a8bad2" text-anchor="middle">Node.js 22+ on Windows or macOS, then four prompts</text>
<path d="M44 126V486" stroke="#375271" stroke-width="2" stroke-dasharray="4 4"/>
<circle cx="44" cy="126" r="15" fill="#ffd166"/><text x="44" y="131" font-size="15" font-weight="700" fill="#081222" text-anchor="middle">1</text>
<text x="74" y="124" font-size="15" font-weight="700" fill="#e8f1ff" data-max="240">Run it</text>
<text x="74" y="143" font-size="11" fill="#a8bad2" data-max="240">installs on first run</text>
<rect x="246" y="108" width="456" height="36" rx="6" fill="#0e1926" stroke="#37556c"/>
<text xml:space="preserve" x="258" y="131" font-size="12" data-max="698"><tspan fill="#4de3ff">node chapter-scraper.js</tspan></text>
<circle cx="44" cy="198" r="15" fill="#ffd166"/><text x="44" y="203" font-size="15" font-weight="700" fill="#081222" text-anchor="middle">2</text>
<text x="74" y="196" font-size="15" font-weight="700" fill="#e8f1ff" data-max="240">Find the story</text>
<text x="74" y="215" font-size="11" fill="#a8bad2" data-max="240">or paste a story link</text>
<rect x="246" y="180" width="456" height="36" rx="6" fill="#0e1926" stroke="#37556c"/>
<text xml:space="preserve" x="258" y="203" font-size="12" data-max="698"><tspan fill="#e0eaf2">Enter RoyalRoad URL OR Search Title: </tspan><tspan fill="#ffd166">Mother of Learning</tspan></text>
<circle cx="44" cy="270" r="15" fill="#ffd166"/><text x="44" y="275" font-size="15" font-weight="700" fill="#081222" text-anchor="middle">3</text>
<text x="74" y="268" font-size="15" font-weight="700" fill="#e8f1ff" data-max="240">Pick a result</text>
<text x="74" y="287" font-size="11" fill="#a8bad2" data-max="240">Enter picks result 1</text>
<rect x="246" y="252" width="456" height="36" rx="6" fill="#0e1926" stroke="#37556c"/>
<text xml:space="preserve" x="258" y="275" font-size="12" data-max="698"><tspan fill="#e0eaf2">Pick a number (default 1): </tspan><tspan fill="#ffd166">1</tspan></text>
<circle cx="44" cy="342" r="15" fill="#ffd166"/><text x="44" y="347" font-size="15" font-weight="700" fill="#081222" text-anchor="middle">4</text>
<text x="74" y="340" font-size="15" font-weight="700" fill="#e8f1ff" data-max="240">Choose a format</text>
<text x="74" y="359" font-size="11" fill="#a8bad2" data-max="240">Enter keeps PDF</text>
<rect x="246" y="324" width="456" height="36" rx="6" fill="#0e1926" stroke="#37556c"/>
<text xml:space="preserve" x="258" y="347" font-size="12" data-max="698"><tspan fill="#e0eaf2">Save format: [1] TXT  [2] PDF  [3] EPUB (default 2): </tspan><tspan fill="#ffd166">3</tspan></text>
<circle cx="44" cy="414" r="15" fill="#ffd166"/><text x="44" y="419" font-size="15" font-weight="700" fill="#081222" text-anchor="middle">5</text>
<text x="74" y="412" font-size="15" font-weight="700" fill="#e8f1ff" data-max="240">Group chapters</text>
<text x="74" y="431" font-size="11" fill="#a8bad2" data-max="240">Enter = one file</text>
<rect x="246" y="396" width="456" height="36" rx="6" fill="#0e1926" stroke="#37556c"/>
<text xml:space="preserve" x="258" y="419" font-size="12" data-max="698"><tspan fill="#e0eaf2">Chapters per file (default all, &quot;all&quot; = every chapter): </tspan><tspan fill="#ffd166">all</tspan></text>
<circle cx="44" cy="486" r="15" fill="#ffd166"/><text x="44" y="491" font-size="15" font-weight="700" fill="#081222" text-anchor="middle">6</text>
<text x="74" y="484" font-size="15" font-weight="700" fill="#e8f1ff" data-max="240">Read it</text>
<text x="74" y="503" font-size="11" fill="#a8bad2" data-max="240">the folder opens</text>
<rect x="246" y="468" width="456" height="36" rx="6" fill="#0e1926" stroke="#37556c"/>
<text xml:space="preserve" x="258" y="491" font-size="12" data-max="698"><tspan fill="#8fdbbd">downloads/Mother of Learning (21220)/Mother of Learning.epub</tspan></text>
<text x="360.0" y="540" font-size="14" fill="#ffd166" text-anchor="middle">Rerun with the same answers to retry anything that failed</text>
</g></svg>

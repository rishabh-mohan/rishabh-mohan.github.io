<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400">
  <title>Built to keep a long session alive</title>
  <desc>One browser call at a time; 600 second fetch and 1,200 second request timeouts; 30 tests run in CI without a Google account; only a real 401 triggers sign-in.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#21314c" stroke-width=".7"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m0 0 10 5-10 5" fill="#4de3ff"/></marker>
  </defs>
  <rect width="720" height="400" fill="#081222"/>
  <rect width="720" height="400" fill="url(#grid)"/>
  <g font-family="ui-monospace,monospace" text-anchor="middle">
    <text x="360.0" y="47" font-size="24" fill="#e8f1ff">Built to keep a long session alive</text>
    <rect x="30" y="80" width="320" height="122" rx="10" fill="#111f37" stroke="#375271" stroke-width="2"/><text x="54" y="130" font-size="32" fill="#ffd166" text-anchor="start">1</text><text x="54" y="162" font-size="14" fill="#a8bad2" text-anchor="start">browser call at a time, so</text><text x="54" y="184" font-size="14" fill="#a8bad2" text-anchor="start">sign-in never interrupts one</text><rect x="370" y="80" width="320" height="122" rx="10" fill="#111f37" stroke="#375271" stroke-width="2"/><text x="394" y="130" font-size="32" fill="#ffd166" text-anchor="start">600 s</text><text x="394" y="162" font-size="14" fill="#a8bad2" text-anchor="start">per fetch, with 1,200 s</text><text x="394" y="184" font-size="14" fill="#a8bad2" text-anchor="start">per request</text><rect x="30" y="222" width="320" height="122" rx="10" fill="#111f37" stroke="#375271" stroke-width="2"/><text x="54" y="272" font-size="32" fill="#ffd166" text-anchor="start">30</text><text x="54" y="304" font-size="14" fill="#a8bad2" text-anchor="start">tests run in CI, with</text><text x="54" y="326" font-size="14" fill="#a8bad2" text-anchor="start">no Google account needed</text><rect x="370" y="222" width="320" height="122" rx="10" fill="#111f37" stroke="#375271" stroke-width="2"/><text x="394" y="272" font-size="32" fill="#ffd166" text-anchor="start">401</text><text x="394" y="304" font-size="14" fill="#a8bad2" text-anchor="start">the only status that</text><text x="394" y="326" font-size="14" fill="#a8bad2" text-anchor="start">triggers a new sign-in</text><text x="360" y="380" font-size="15" fill="#e8f1ff">Disconnecting cancels queued work and the active fetch</text>
  </g>
</svg>

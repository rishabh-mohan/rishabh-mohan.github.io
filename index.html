<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rishabh Mohan</title>
  <meta name="description" content="Rishabh Mohan, Purdue CS ’30. Explore my projects in six movable windows.">
  <link rel="stylesheet" href="styles.css">
  <script defer src="projects.js"></script>
  <script defer src="corner-art.js"></script>
  <script defer src="postmodern-eye.js"></script>
  <script defer src="postmodern-ships.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <canvas id="forest" aria-hidden="true"></canvas>
  <div class="shell">
    <header class="site-header">
      <h1>Hi, I’m Rishabh</h1>
      <div class="header-details">
        <p class="school">Purdue CS ’30</p>
        <nav aria-label="Social links"><a href="https://github.com/rishabh-mohan">GitHub</a><span aria-hidden="true"> ° </span><a href="https://www.linkedin.com/in/mohan-rishabh">LinkedIn</a></nav>
      </div>
    </header>
    <main id="main">
      <div class="toolbar">
        <p id="instructions">Drag a grip to swap, or press two slot numbers.</p>
        <button id="shuffle" type="button">⇄ Shuffle</button>
        <div class="eye-drop" aria-hidden="true">
          <canvas class="eye-assembly"></canvas>
        </div>
      </div>
      <div id="desk">
        <div id="grid" aria-label="Project windows"></div>
        <section id="expanded" aria-labelledby="expanded-title" hidden>
          <header class="window-bar">
            <h2 id="expanded-title"></h2>
            <button id="close" type="button" aria-label="Close expanded project">×</button>
          </header>
          <nav id="detail-nav" aria-label="Project sections"></nav>
          <div id="project-content"></div>
        </section>
      </div>
      <p id="status" class="visually-hidden" role="status"></p>
    </main>
    <p id="unsupported">The project grid needs a wider, taller browser window. A layout for smaller screens is coming.</p>
    <button class="motion" id="motion" type="button" aria-pressed="false">Pause background</button>
    <noscript>Enable JavaScript to explore the project windows.</noscript>
  </div>
</body>
</html>
